name: won_deal_chat
description: 'When a deal in the CRM moves to the stage "won", post a message to the #sales chat channel:

  "Deal won: <deal name> (<amount> <currency>)". Do nothing for other stages.

  '
seed: 11
apps: [crm, chat]
world:
  contacts: 8
  channels: [sales, general]
events:
- type: deal.stage_changed
  count: 12
  stages: {won: 5, lost: 4, proposal: 3}
