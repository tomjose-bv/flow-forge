[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-forge"
version = "0.0.1"
description = "Local AI agent that turns plain-English workflow descriptions into tested integration recipes, plus a correctness benchmark."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flow-forge = "flow_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
